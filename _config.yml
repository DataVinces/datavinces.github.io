# URL for the Image of the Author
author-image: assets/images/datavinces_logo.png #https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_960_720.png
# 60 Words About the Author
author-about: "Our path to success combines the power of <span class='bold-word'> AI </span> with <span class='bold-word'> scientific expertise</span>, <span class='bold-word'> software engineering </span>, and the essential fuel behind it all: <span class='bold-word'> data </span>"
              #  Driving research, development, and innovation with AI
author-work: "With your <span class='bold-word'>data</span> and our <span class='bold-word'>expertise</span>, we win together! <br> We successfully complete the journey from <span class='bold-word'>idea</span> to <span class='bold-word'>AI research</span>, from <span class='bold-word'>prototype</span> to <span class='bold-word'>real-world solution</span> 🚀"
              #  Driving research, development, and innovation with AI
# URL to the Author's Profile (i.e., Github, Twitter, Stackoverflow, etc)
author-url: hhttps://github.com/DataVinces

author-footer: "We turn complex challenges into smart solutions by harnessing AI, deep scientific know-how, data science, and engineering"

# SASS
sass:
  sass_dir: _sass
  style: compressed

# Build settings
plugins:
  - jekyll-admin
  - jekyll-feed

# Permalink
permalink: "blog/:title"

# Compress
compress_html:
  clippings: all

# Defaults
defaults:
  -
    scope:
      type: 'posts'
    values:
      layout: post
      post-image: ""
      description: ""
      tags:
        - ""
  -
    scope:
      type: 'pages'
    values:
      layout: page

# Exclude
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
