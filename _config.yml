# WhatATheme
markdown: kramdown

# URL of the Site
url: ''
# Base URL of the Site (i.e., Name of the Repository in which the Site is hosted)
baseurl: 

# Title of the Site
title: Data Vinces
# Description of the Site
description: We are an AI accelerator company that helps our partners and public-private initiatives drive innovation based on Artificial Intelligence solutions
# URL of Image of the Site
site-image: /assets/images/datavinces_logo.jpg #/WhatATheme/assets/images/meta.jpg
# Keywords of the Site
site-keywords: Data Science, AI, Machine Learning
# URL for the Image of custom Favicon
favicon-url: /assets/images/datavinces_icon.png

# URL of the Image of Custom Hero Image (i.e., the image in the background of the very first section of the Homepage)
heroimage: /assets/images/main_picture.jpg #https://images.pexels.com/photos/220444/pexels-photo-220444.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=650&w=940

